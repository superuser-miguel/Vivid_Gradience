name: Build

# Deliberately manual. This builds the Devel manifest against GNOME master, so
# it is an early warning that the runtime is moving under us -- not a gate on
# anything we ship. The real gate is the clean-room build from the pinned
# release manifest in RELEASING.md, which runs on a fresh tmpfs state dir.
on:
  workflow_dispatch:

jobs:
  flatpak:
    name: Flatpak
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    # x86_64 only, because that is what we ship. The arm leg produced bundles
    # nobody installed, and materialyoucolor publishes no aarch64 wheel, so it
    # would have to compile the sdist on an emulated-slow runner to get there.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          repository-name: gnome-nightly
          bundle: gradience-devel.flatpak
          manifest-path: build-aux/flatpak/io.github.superuser_miguel.VividGradience.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}-x86_64
          arch: x86_64
          verbose: true
