[type.po]
extend-glob = ["*.po"]
check-file = false

[type.svg]
extend-glob = ["*.svg"]
check-file = false

# "PNGs" splits into PN + Gs, and typos reads PN as a misspelt ON.
[default.extend-words]
PN = "PN"

# Vendored upstream GNOME Shell SASS — not ours to spellcheck.
[files]
extend-exclude = ["data/submodules/"]
